name: Backup Supabase data

on:
  schedule:
    - cron: "0 3 * * 0" # weekly, Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch workout_sessions table
        env:
          SUPABASE_URL: https://hraauzocvqrkeebdsrxd.supabase.co
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p backups
          curl -sf "$SUPABASE_URL/rest/v1/workout_sessions?select=*" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -o "backups/workout_sessions_$(date -u +%Y-%m-%d).json"

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Weekly Supabase backup $(date -u +%Y-%m-%d)"
          git push
