name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish GymTracker.App/GymTracker.App.csproj -c Release -o publish-output

      - name: Set base href for GitHub Pages subpath
        run: |
          sed -i "s|<base href=\"/\" />|<base href=\"/${{ github.event.repository.name }}/\" />|" publish-output/wwwroot/index.html

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp publish-output/wwwroot/index.html publish-output/wwwroot/404.html
          touch publish-output/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish-output/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
